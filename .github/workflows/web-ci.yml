name: Web CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify character asset hashes
        run: |
          cd public/assets/characters
          sha256sum -c MANIFEST.sha256

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript + Vite production build
        run: npm run build
